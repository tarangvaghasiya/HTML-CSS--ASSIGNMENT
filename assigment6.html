<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Over Scoreboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to bottom,
                #07172b,
                #13283a 55%,
                #183d14 56%,
                #071b08
            );

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 550px;
            padding: 25px;
            text-align: center;
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        .ground {
            position: absolute;
            width: 130%;
            height: 100px;
            left: -15%;
            top: 65%;
            border: 12px solid #52606b;
            border-radius: 50%;
            opacity: 0.4;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 55px;
            position: relative;
            z-index: 1;
        }

        .logo span {
            display: block;
        }

        .scorecards {
            display: flex;
            justify-content: center;
            gap: 70px;
            position: relative;
            z-index: 1;
        }

        .team {
            width: 320px;
            height: 255px;
            border-radius: 15px;
            color: white;
            padding: 32px 15px;
        }

        .india {
            background-color: #1765b5;
        }

 
        .pakistan {
            background-color: #39a91d;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 30px;
        }


        .balls {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 20px;
        }


        .ball {
            width: 34px;
            height: 34px;
            background-color: white;
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .total {
            font-size: 34px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 55px;
            position: relative;
            z-index: 1;
        }

        .btn {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 22px;
            color: white;
            font-size: 43px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 5px #00000066;
        }

   
        .bat {
            background-color: #ffb52e;
        }


        .reset {
            background-color: #f22e32;
        }


        @media (max-width: 750px) {
            .container {
                min-height: 100vh;
                padding: 25px 10px;
            }

            .logo {
                margin-bottom: 35px;
            }

            .scorecards {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .team {
                width: 100%;
                max-width: 320px;
                height: 225px;
                padding: 22px 8px;
            }

            h1 {
                font-size: 42px;
                margin-bottom: 22px;
            }

            .balls {
                gap: 5px;
            }

            .ball {
                width: 32px;
                height: 32px;
                font-size: 17px;
            }

            .total {
                font-size: 30px;
            }

            .buttons {
                margin-top: 30px;
                gap: 30px;
            }

            .btn {
                width: 60px;
                height: 60px;
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="ground"></div>

        <div class="logo">
            🏏 SUPER
            <span>OVER</span>
        </div>

        <div class="scorecards">

            <div class="team india">

                <h1>IND</h1>

                <div class="balls">
                    <div class="ball">4</div>
                    <div class="ball">3</div>
                    <div class="ball">2</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                </div>

                <div class="total">27 / 0</div>

            </div>

    
            <div class="team pakistan">

                <h1>PAK</h1>

                <div class="balls">
                    <div class="ball">2</div>
                    <div class="ball">4</div>
                    <div class="ball">0</div>
                    <div class="ball">3</div>
                    <div class="ball">1</div>
                    <div class="ball">4</div>
                </div>

                <div class="total">14 / 0</div>

            </div>

        </div>

        <div class="buttons">

            <div class="btn bat">🏏</div>

            <div class="btn reset">⟲</div>

        </div>

    </div>

</body>
</html>
