<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Puzzle and Answer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .sudoku-section {
            text-align: center;
        }

        h2 {
            font-size: 23px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 18px;
            color: #222;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 296px;
            height: 296px;
            border: 2px solid #222;
        }

        .cell {
            border: 0.5px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            color: #222;
            font-weight: normal;
        }

        .green {
            background-color: #a8d7b9;
        }

        .cell:nth-child(3n) {
            border-right: 1px solid #333;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 1px solid #333;
        }

        @media (max-width: 680px) {
            .container {
                gap: 35px;
            }

            .grid {
                width: min(88vw, 296px);
                height: min(88vw, 296px);
            }

            .cell {
                font-size: clamp(14px, 4vw, 23px);
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
