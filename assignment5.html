<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .board {
            width: 330px;
            height: 330px;
            position: relative;
            background-color: white;
            border: 1px solid #333;
        }

        .home {
            width: 132px;
            height: 132px;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        .yellow {
            background-color: yellow;
        }

        .red-home {
            top: 0;
            left: 0;
        }

        .green-home {
            top: 0;
            right: 0;
        }

        .blue-home {
            bottom: 0;
            left: 0;
        }

        .yellow-home {
            bottom: 0;
            right: 0;
        }

        .inner {
            width: 88px;
            height: 88px;
            background-color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            justify-items: center;
            align-items: center;
            padding: 7px;
        }

        .circle {
            width: 22px;
            height: 22px;
            border: 2px solid;
            border-radius: 50%;
            background-color: white;
        }

        .red-circle {
            border-color: red;
        }

        .green-circle {
            border-color: green;
        }

        .blue-circle {
            border-color: blue;
        }

        .yellow-circle {
            border-color: yellow;
        }

        .path {
            position: absolute;
            display: grid;
        }

        .cell {
            border: 1px solid #888;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            color: black;
        }

        .top-path {
            top: 0;
            left: 132px;
            width: 66px;
            height: 132px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .bottom-path {
            bottom: 0;
            left: 132px;
            width: 66px;
            height: 132px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .left-path {
            top: 132px;
            left: 0;
            width: 132px;
            height: 66px;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .right-path {
            top: 132px;
            right: 0;
            width: 132px;
            height: 66px;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .red-cell {
            background-color: red;
        }

        .green-cell {
            background-color: green;
        }

        .blue-cell {
            background-color: blue;
        }

        .yellow-cell {
            background-color: yellow;
        }

        .center {
            width: 66px;
            height: 66px;
            position: absolute;
            top: 132px;
            left: 132px;
            overflow: hidden;
        }

        .triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .triangle-top {
            top: 0;
            left: 0;
            border-width: 0 33px 33px 33px;
            border-color: transparent transparent yellow transparent;
            transform: rotate(180deg);
        }

        .triangle-right {
            top: 0;
            right: 0;
            border-width: 33px 0 33px 33px;
            border-color: transparent transparent transparent yellow;
        }

        .triangle-bottom {
            bottom: 0;
            left: 0;
            border-width: 33px 33px 0 33px;
            border-color: blue transparent transparent transparent;
        }

        .triangle-left {
            top: 0;
            left: 0;
            border-width: 33px 33px 33px 0;
            border-color: transparent red transparent transparent;
        }

        .center {
            background: conic-gradient(
                from 45deg,
                yellow 0deg 90deg,
                green 90deg 180deg,
                blue 180deg 270deg,
                red 270deg 360deg
            );
        }

        .star {
            font-size: 17px;
            color: black;
        }

        @media (max-width: 350px) {
            .board {
                transform: scale(0.9);
                transform-origin: center;
            }
        }
    </style>
</head>

<body>

    <div class="board">

        <div class="home red red-home">
            <div class="inner">
                <div class="circle red-circle"></div>
                <div class="circle red-circle"></div>
                <div class="circle red-circle"></div>
                <div class="circle red-circle"></div>
            </div>
        </div>

        <div class="home green green-home">
            <div class="inner">
                <div class="circle green-circle"></div>
                <div class="circle green-circle"></div>
                <div class="circle green-circle"></div>
                <div class="circle green-circle"></div>
            </div>
        </div>

        <div class="home blue blue-home">
            <div class="inner">
                <div class="circle blue-circle"></div>
                <div class="circle blue-circle"></div>
                <div class="circle blue-circle"></div>
                <div class="circle blue-circle"></div>
            </div>
        </div>

        <div class="home yellow yellow-home">
            <div class="inner">
                <div class="circle yellow-circle"></div>
                <div class="circle yellow-circle"></div>
                <div class="circle yellow-circle"></div>
                <div class="circle yellow-circle"></div>
            </div>
        </div>

        <div class="path top-path">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell green-cell"><span class="star">★</span></div>

            <div class="cell green-cell"><span class="star">★</span></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-cell"></div>
            <div class="cell"></div>
        </div>
        <div class="path bottom-path">
            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>

            <div class="cell "></div>
            <div class="cell blue-cell"></div>
            <div class="cell blue-cell"><span class="star">★</span></div>

            <div class="cell blue-cell"><span class="star">★</span></div>
            <div class="cell blue-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="path left-path">
            <div class="cell"></div>
            <div class="cell red-cell"><span class="star">★</span></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>
            <div class="cell red-cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell red-cell"><span class="star">★</span></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="path right-path">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow-cell"><span class="star">★</span></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell yellow-cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow-cell"><span class="star">★</span></div>
            <div class="cell"></div>
        </div>

        <div class="center"></div>

    </div>

</body>
</html>
